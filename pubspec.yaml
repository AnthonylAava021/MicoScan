name: micotax
description: "Aplicación predictiva de hongos micorrizos"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  shared_preferences: ^2.2.2
  permission_handler: ^11.3.1
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  image_path: "logo/SPLASH.png"

flutter:
  uses-material-design: true
  assets:
    - logo/
    - imagenes/
    - imagenes/icono 1.png
    - imagenes/esporas bajo el microscopio.jpg
    - imagenes/micorriza en la naturaleza.jpg
